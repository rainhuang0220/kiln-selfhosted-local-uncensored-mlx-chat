# Production vhost: static web/dist + API reverse proxy to a loopback SSH tunnel.
# Live path on this maintainer VPS: /www/server/panel/vhost/nginx/kiln.plainlist.space.conf
# Do not proxy a Vite development server.

# Kiln public UI. Do not includeSubDomains (plainlist.space is a different site).
server {
    listen 80;
    listen [::]:80;
    server_name kiln.plainlist.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://kiln.plainlist.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiln.plainlist.space;

    ssl_certificate     /etc/letsencrypt/live/kiln.plainlist.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiln.plainlist.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # No cookies or request bodies. Host is explicit so kiln traffic is auditable.
    access_log /www/wwwlogs/kiln.plainlist.space.log combined;

    include /www/server/panel/vhost/nginx/kiln-security-headers.conf;

    root /www/wwwroot/kiln.plainlist.space;
    gzip on;

    location = /health {
        return 404;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /docs {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location ^~ /auth {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /chat {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    location ^~ /conversation {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        include /www/server/panel/vhost/nginx/kiln-security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    location ^~ /context {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        include /www/server/panel/vhost/nginx/kiln-security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    location ^~ /memory {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        include /www/server/panel/vhost/nginx/kiln-security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    location ^~ /models {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /generate {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        include /www/server/panel/vhost/nginx/kiln-security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    location ^~ /narrative {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        include /www/server/panel/vhost/nginx/kiln-security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
