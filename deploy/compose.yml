# Public Kiln with inference supplied by an MLX server through an SSH reverse tunnel.
# host networking is required so the API can reach the tunnel on loopback
# (Docker extra_hosts/host-gateway cannot hit 127.0.0.1 binds).
# The running model remains on the local MLX host; this deployment stores no weights.
services:
  api:
    build:
      context: ../backend
    env_file:
      - ${KILN_ENV_FILE:-.env}
    environment:
      APP_HOST: 127.0.0.1
      APP_PORT: 8787
      SQLITE_PATH: /data/chat.db
      MODEL_SELECTION_STATE_PATH: /data/active-model.json
      MLX_BASE_URL: http://127.0.0.1:8081
      MODEL_DOWNLOADS_ENABLED: "false"
      MODEL_SWITCH_ENABLED: "false"
    network_mode: host
    volumes:
      - kiln-public-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    env_file:
      - ${KILN_ENV_FILE:-.env}
    volumes:
      - kiln-caddy-data:/data
      - kiln-caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 128m

volumes:
  kiln-public-data:
  kiln-caddy-data:
  kiln-caddy-config:
