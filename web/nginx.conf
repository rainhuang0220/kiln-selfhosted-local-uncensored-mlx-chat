limit_req_zone $binary_remote_addr zone=kiln_chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kiln_api:10m rate=5r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json;

  location / {
    try_files $uri /index.html;
  }

  location /auth {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
  }

  location /chat {
    limit_req zone=kiln_chat burst=5 nodelay;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header X-Accel-Buffering no always;
  }

  location /conversation {
    limit_req zone=kiln_api burst=20 nodelay;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /context {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
  }

  location /memory {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
  }

  location /v1/ {
    limit_req zone=kiln_chat burst=5 nodelay;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    add_header X-Accel-Buffering no always;
  }
}
