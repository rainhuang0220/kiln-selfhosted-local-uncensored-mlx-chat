services:
  api:
    build:
      context: ./backend
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8787
      MLX_BASE_URL: http://host.docker.internal:8081
      SQLITE_PATH: /data/chat.db
      MODEL_PATH: /model
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - kiln-data:/data
      - ${MODEL_PATH_HOST:-../qwen3.5-9b-hauhau-aggressive-mxfp4}:/model:ro
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  kiln-data:
