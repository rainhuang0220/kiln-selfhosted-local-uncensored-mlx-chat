name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv lock --check
        working-directory: backend
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: bash tests/test_web_tunnel.sh
      - run: bash tests/test_vps_direct_route.sh
      - run: bash tests/test_fetch_model.sh
      - run: bash tests/test_activate_model.sh
      - run: uv run pytest -q
        working-directory: backend
      - run: npm test --prefix web
      - run: npm run build
      - run: docker run --rm -e KILN_DOMAIN=chat.example.com -e ACME_EMAIL=ops@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: bash scripts/check-public-tree.sh
